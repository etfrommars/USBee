<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#334155" stroke-width="2"/>
  
  <!-- USB Trident Icon Glow & Geometry -->
  <defs>
    <linearGradient id="usbGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Stem -->
  <line x1="32" y1="46" x2="32" y2="18" stroke="url(#usbGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Center Arrow Head -->
  <polygon points="32,13 27,21 37,21" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Bottom Circle Base -->
  <circle cx="32" cy="48" r="4" fill="#6366f1"/>
  
  <!-- Left Branch -->
  <path d="M 32 36 C 26 36 22 34 22 28 L 22 23" stroke="url(#usbGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Square Terminal -->
  <rect x="18" y="19" width="8" height="8" rx="1.5" fill="#10b981"/>
  
  <!-- Right Branch -->
  <path d="M 32 40 C 38 40 42 38 42 32 L 42 27" stroke="url(#usbGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Circle Terminal -->
  <circle cx="42" cy="24" r="4" fill="#38bdf8"/>

  <!-- Accent Status Light -->
  <circle cx="52" cy="12" r="3" fill="#10b981" filter="url(#glow)"/>
</svg>
