<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Slate Background Canvas with Border -->
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1e293b" stroke-width="1.5"/>

  <defs>
    <!-- Connector Chrome Metal Gradient -->
    <linearGradient id="metalPlug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- U-Disk Body Tech Gradient -->
    <linearGradient id="uBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Glowing LED Filter -->
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. USB Metal Plug (Connector) -->
  <path d="M 23 8 L 41 8 C 42.1 8 43 8.9 43 10 L 43 22 L 21 22 L 21 10 C 21 8.9 21.9 8 23 8 Z" fill="url(#metalPlug)" stroke="#334155" stroke-width="1"/>

  <!-- USB Standard Connector Holes (Two distinct dark square windows) -->
  <rect x="25" y="12" width="4.5" height="5" rx="1" fill="#0f172a"/>
  <rect x="34.5" y="12" width="4.5" height="5" rx="1" fill="#0f172a"/>

  <!-- Gold Pins inside windows -->
  <line x1="26" y1="18.5" x2="28.5" y2="18.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="35.5" y1="18.5" x2="38" y2="18.5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Metal collar junction band -->
  <rect x="20" y="21" width="24" height="2.5" rx="1" fill="#475569"/>

  <!-- 2. Main U-Disk Body (Drive Casing) -->
  <rect x="17" y="23" width="30" height="32" rx="6" fill="url(#uBody)" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Grip / Texture accents on drive casing -->
  <line x1="24" y1="35" x2="40" y2="35" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="24" y1="39" x2="40" y2="39" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Lanyard / Keychain Loop Cutout at Bottom -->
  <rect x="26" y="47.5" width="12" height="3" rx="1.5" fill="#0b0f19" stroke="#312e81" stroke-width="1"/>

  <!-- 3. LED Indicator Light -->
  <circle cx="32" cy="29" r="2" fill="#10b981" filter="url(#glowGreen)"/>
  <circle cx="32" cy="29" r="1" fill="#a7f3d0"/>
</svg>
